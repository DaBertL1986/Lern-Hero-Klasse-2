<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Lern-Held" />


<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lern-Held 2. Klasse</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff 0%, #fef9c3 50%, #dcfce7 100%);
      color: #1e293b;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      text-align: center;
      color: #3730a3;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .pill {
      background: #f1f5f9;
      padding: 8px 14px;
      border-radius: 999px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #4f46e5;
      color: #fff;
    }
    .mode-selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .mode-btn {
      padding: 10px 16px;
      border-radius: 14px;
      border: none;
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .mode-btn.active {
      background: #8b5cf6;
      color: #fff;
    }
    .row-selector, .german-cat-selector, .math-extra-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .row-btn, .cat-btn, .extra-btn {
      padding: 8px 14px;
      border-radius: 12px;
      border: none;
      background: #ffffff;
      color: #1e293b;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn {
      background: #f1f5f9;
    }
    .row-btn.active {
      background: #0ea5e9;
      color: #fff;
    }
    .extra-btn.special.active {
      background: #eab308;
      color: #fff;
    }
    .cat-btn.active {
      background: #4f46e5;
      color: #fff;
    }
    .cat-btn.special {
      background: #fef08a;
      color: #854d0e;
    }
    .cat-btn.special.active {
      background: #eab308;
      color: #fff;
    }
    .card {
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .question {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 10px 0 16px;
      color: #0f172a;
    }
    .hint {
      font-size: 1rem;
      color: #475569;
      margin-bottom: 14px;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .num-input {
      font-size: 1.8rem;
      padding: 10px 16px;
      width: 140px;
      text-align: center;
      border-radius: 14px;
      border: none;
      background: #ffffff;
      font-weight: 700;
    }
    .num-input:focus {
      outline: none;
    }
    .opt-btn, .word-btn, .primary-btn {
      padding: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 16px;
      border: none;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .opt-btn, .opt-btn:hover, .opt-btn:focus, .opt-btn:active {
      background: #ffffff;
      color: #1e293b;
      border: none;
      outline: none;
    }
    .word-btn:hover {
      background: #eef2ff;
    }
    .opt-btn:focus, .word-btn:focus, .row-btn:focus, .cat-btn:focus, .extra-btn:focus, .mode-btn:focus, .tab-btn:focus, .primary-btn:focus {
      outline: none;
    }
    .word-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .word-btn.selected {
      background: #fef08a;
    }
    .word-btn.wrong-pick {
      background: #fee2e2;
      color: #991b1b;
    }
    .word-btn.missed-right {
      background: #dcfce7;
      color: #166534;
    }
    .primary-btn {
      background: #16a34a;
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }
    .feedback {
      margin-top: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      min-height: 28px;
    }
    .ok { color: #15803d; }
    .no { color: #dc2626; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Lern-Held 2. Klasse</h1>
    <div class="stats">
      <div class="pill">Sterne: <span id="stars">0</span></div>
      <div class="pill">Serie: <span id="streak">0</span></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-math" onclick="switchTab('math')">Mathe (Multiplizieren)</button>
      <button class="tab-btn" id="tab-german" onclick="switchTab('german')">Deutsch (Wörter)</button>
    </div>

    <div id="math-section">
      <div class="mode-selector">
        <button class="mode-btn active" id="mode-choice" onclick="setAnswerMode('choice')">Multiple Choice</button>
        <button class="mode-btn" id="mode-input" onclick="setAnswerMode('input')">Zahlen-Eingabe</button>
      </div>

      <div class="row-selector" id="row-selector"></div>

      <div class="math-extra-selector">
        <button class="extra-btn special" id="btn-mix-pm" onclick="toggleMixPlusMinus()">Gemischt mit +/-</button>
      </div>

      <div class="card">
        <div class="hint" id="math-order-info"></div>
        <div class="question" id="math-question"></div>
        <div class="hint" id="math-hint"></div>

        <div class="options" id="math-options"></div>

        <div class="input-box" id="math-input-box" style="display:none;">
          <input type="number" id="math-user-input" class="num-input" placeholder="?" pattern="[0-9]*" inputmode="numeric" />
          <button class="primary-btn" style="max-width:220px;" onclick="checkMathInput()">Prüfen</button>
        </div>

        <div class="feedback" id="math-feedback"></div>
      </div>
    </div>

    <div id="german-section" style="display:none;">
      <div class="german-cat-selector" id="german-cat-selector">
        <button class="cat-btn active" id="cat-namen" onclick="setGermanCategory('namen')">Namenwörter</button>
        <button class="cat-btn" id="cat-tun" onclick="setGermanCategory('tun')">Tun-Wörter</button>
        <button class="cat-btn special" id="cat-mix" onclick="setGermanCategory('mix')">Gemischt</button>
      </div>

      <div class="card">
        <div class="hint" id="german-instruction"></div>
        <div class="word-grid" id="german-words"></div>
        <button class="primary-btn" onclick="checkGerman()">Antwort prüfen</button>
        <div class="feedback" id="german-feedback"></div>
      </div>
    </div>
  </div>

  <script>
    let stars = 0;
    let streak = 0;
    let activeRows = new Set([2]);
    let mixPlusMinusEnabled = false;
    let answerMode = 'choice';
    let currentAnswer = null;
    let currentLabel = "";

    let germanCategory = 'namen';
    let currentGermanTask = null;
    let namenIndex = 0;
    let tunIndex = 0;
    let mixStep = 0;
    let selectedWordIndices = new Set();

    const namenTasks = [
      {
        expectedType: "namen",
        title: "Welche Wörter sind NAMENWÖRTER (Nomen)?",
        words: [
          { text: "Katze", type: "namen" },
          { text: "laufen", type: "tun" },
          { text: "Ball", type: "namen" },
          { text: "springen", type: "tun" },
          { text: "Baum", type: "namen" },
          { text: "lachen", type: "tun" }
        ]
      },
      {
        expectedType: "namen",
        title: "Welche Wörter sind NAMENWÖRTER (Nomen)?",
        words: [
          { text: "Apfel", type: "namen" },
          { text: "malen", type: "tun" },
          { text: "Schule", type: "namen" },
          { text: "singen", type: "tun" },
          { text: "Hund", type: "namen" },
          { text: "rennen", type: "tun" }
        ]
      },
      {
        expectedType: "namen",
        title: "Welche Wörter sind NAMENWÖRTER (Nomen)?",
        words: [
          { text: "Haus", type: "namen" },
          { text: "lesen", type: "tun" },
          { text: "Tisch", type: "namen" },
          { text: "spielen", type: "tun" },
          { text: "Blume", type: "namen" },
          { text: "schwimmen", type: "tun" }
        ]
      }
    ];

    const tunTasks = [
      {
        expectedType: "tun",
        title: "Welche Wörter sind TUN-WÖRTER (Verben)?",
        words: [
          { text: "malen", type: "tun" },
          { text: "Apfel", type: "namen" },
          { text: "singen", type: "tun" },
          { text: "Schule", type: "namen" },
          { text: "rennen", type: "tun" },
          { text: "Hund", type: "namen" }
        ]
      },
      {
        expectedType: "tun",
        title: "Welche Wörter sind TUN-WÖRTER (Verben)?",
        words: [
          { text: "klettern", type: "tun" },
          { text: "Buch", type: "namen" },
          { text: "tanzen", type: "tun" },
          { text: "Stuhl", type: "namen" },
          { text: "schlafen", type: "tun" },
          { text: "Fenster", type: "namen" }
        ]
      },
      {
        expectedType: "tun",
        title: "Welche Wörter sind TUN-WÖRTER (Verben)?",
        words: [
          { text: "hüpfen", type: "tun" },
          { text: "Auto", type: "namen" },
          { text: "basteln", type: "tun" },
          { text: "Bett", type: "namen" },
          { text: "rufen", type: "tun" },
          { text: "Sonne", type: "namen" }
        ]
      }
    ];

    function updateStats(correct) {
      if (correct) {
        stars += 1;
        streak += 1;
      } else {
        streak = 0;
      }
      document.getElementById("stars").textContent = stars;
      document.getElementById("streak").textContent = streak;
    }

    function switchTab(tab) {
      document.getElementById("tab-math").classList.toggle("active", tab === "math");
      document.getElementById("tab-german").classList.toggle("active", tab === "german");
      document.getElementById("math-section").style.display = tab === "math" ? "block" : "none";
      document.getElementById("german-section").style.display = tab === "german" ? "block" : "none";
      if (tab === "german") renderGerman();
    }

    function setAnswerMode(mode) {
      answerMode = mode;
      document.getElementById("mode-choice").classList.toggle("active", mode === "choice");
      document.getElementById("mode-input").classList.toggle("active", mode === "input");

      document.getElementById("math-options").style.display = mode === "choice" ? "grid" : "none";
      document.getElementById("math-input-box").style.display = mode === "input" ? "flex" : "none";

      if (mode === "input") {
        const inp = document.getElementById("math-user-input");
        inp.value = "";
        inp.focus();
      }
    }

    function setGermanCategory(cat) {
      germanCategory = cat;
      document.getElementById("cat-namen").classList.toggle("active", cat === "namen");
      document.getElementById("cat-tun").classList.toggle("active", cat === "tun");
      document.getElementById("cat-mix").classList.toggle("active", cat === "mix");
      renderGerman();
    }

    function getSortedActiveRows() {
      return Array.from(activeRows).sort((a, b) => a - b);
    }

    function updateExtraButtonsUI() {
      document.getElementById("btn-mix-pm").classList.toggle("active", mixPlusMinusEnabled);
    }

    function toggleMixPlusMinus() {
      mixPlusMinusEnabled = !mixPlusMinusEnabled;
      updateExtraButtonsUI();
      nextMathQuestion();
    }

    function buildRowButtons() {
      const container = document.getElementById("row-selector");
      container.innerHTML = "";

      for (let r = 1; r <= 10; r++) {
        const btn = document.createElement("button");
        const isActive = activeRows.has(r);
        btn.className = "row-btn" + (isActive ? " active" : "");
        btn.textContent = r + "er-Reihe";
        btn.onclick = () => {
          if (activeRows.has(r)) {
            if (activeRows.size > 1) {
              activeRows.delete(r);
            }
          } else {
            activeRows.add(r);
          }
          buildRowButtons();
          nextMathQuestion();
        };
        container.appendChild(btn);
      }
    }

    function formatRowMultiplication(row, multiplier) {
      return `${multiplier} · ${row}`;
    }

    function nextMathQuestion() {
      let hintText = "";
      const chosenRows = getSortedActiveRows();
      const row = chosenRows[Math.floor(Math.random() * chosenRows.length)];
      const rowsSummary = chosenRows.map((r) => `${r}er`).join(", ");

      if (mixPlusMinusEnabled) {
        const multiplier = Math.floor(Math.random() * 6) + 1;
        const multLabel = formatRowMultiplication(row, multiplier);
        const multProduct = row * multiplier;
        const isPlus = Math.random() > 0.4;
        const addSub = Math.floor(Math.random() * 9) + 1;

        if (isPlus) {
          currentLabel = `${multLabel} + ${addSub}`;
          currentAnswer = multProduct + addSub;
          hintText = `Tipp: Zuerst ${multLabel} = ${multProduct}, dann + ${addSub}`;
        } else {
          const safeSub = Math.min(addSub, multProduct - 1);
          const finalSub = safeSub < 1 ? 1 : safeSub;
          currentLabel = `${multLabel} - ${finalSub}`;
          currentAnswer = multProduct - finalSub;
          hintText = `Tipp: Zuerst ${multLabel} = ${multProduct}, dann - ${finalSub}`;
        }

        document.getElementById("math-order-info").textContent =
          `Gemischt mit +/- (${rowsSummary})`;
      } else {
        const multiplier = Math.floor(Math.random() * 10) + 1;

        currentLabel = formatRowMultiplication(row, multiplier);
        currentAnswer = row * multiplier;
        hintText = `${multiplier} × die ${row}er-Reihe`;

        document.getElementById("math-order-info").textContent =
          `Reihe (${rowsSummary})`;
      }

      document.getElementById("math-question").textContent = `${currentLabel} = ?`;
      document.getElementById("math-hint").textContent = hintText;
      document.getElementById("math-feedback").textContent = "";

      const choices = new Set([currentAnswer]);
      while (choices.size < 4) {
        const offset = Math.floor(Math.random() * 9) - 4;
        const candidate = currentAnswer + offset;
        if (candidate > 0 && candidate <= 100) {
          choices.add(candidate);
        }
      }

      const shuffled = Array.from(choices).sort(() => Math.random() - 0.5);
      const optionsEl = document.getElementById("math-options");
      optionsEl.innerHTML = "";

      shuffled.forEach((val) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = val;
        btn.onclick = () => {
          btn.blur();
          evaluateAnswer(val);
        };
        optionsEl.appendChild(btn);
      });

      const inputEl = document.getElementById("math-user-input");
      inputEl.value = "";
      if (answerMode === 'input') {
        inputEl.focus();
      }
    }

    function checkMathInput() {
      const inputEl = document.getElementById("math-user-input");
      const val = parseInt(inputEl.value.trim(), 10);
      if (isNaN(val)) return;

      inputEl.value = "";
      inputEl.focus();

      evaluateAnswer(val);
    }

    document.getElementById("math-user-input").addEventListener("keyup", function(e) {
      if (e.key === "Enter") {
        checkMathInput();
      }
    });

    function evaluateAnswer(val) {
      const fb = document.getElementById("math-feedback");
      if (val === currentAnswer) {
        updateStats(true);
        fb.className = "feedback ok";
        fb.textContent = `Super! ${currentLabel} = ${currentAnswer} (+1 Stern)`;
        setTimeout(nextMathQuestion, 900);
      } else {
        updateStats(false);
        fb.className = "feedback no";
        fb.textContent = `Fast! Versuch es bei ${currentLabel} noch einmal.`;
      }
    }

    function clearWordResultClasses() {
      const buttons = document.querySelectorAll("#german-words .word-btn");
      buttons.forEach((btn) => {
        btn.classList.remove("wrong-pick", "missed-right");
      });
    }

    function pickGermanTask() {
      if (germanCategory === "namen") {
        const task = namenTasks[namenIndex % namenTasks.length];
        namenIndex += 1;
        return task;
      }
      if (germanCategory === "tun") {
        const task = tunTasks[tunIndex % tunTasks.length];
        tunIndex += 1;
        return task;
      }
      const useNamen = mixStep % 2 === 0;
      mixStep += 1;
      if (useNamen) {
        const task = namenTasks[namenIndex % namenTasks.length];
        namenIndex += 1;
        return task;
      } else {
        const task = tunTasks[tunIndex % tunTasks.length];
        tunIndex += 1;
        return task;
      }
    }

    function renderGerman() {
      currentGermanTask = pickGermanTask();
      selectedWordIndices.clear();
      document.getElementById("german-instruction").textContent = currentGermanTask.title;
      document.getElementById("german-feedback").textContent = "";

      const grid = document.getElementById("german-words");
      grid.innerHTML = "";
      currentGermanTask.words.forEach((w, idx) => {
        const btn = document.createElement("button");
        btn.className = "word-btn";
        btn.textContent = w.text;
        btn.onclick = () => {
          clearWordResultClasses();
          document.getElementById("german-feedback").textContent = "";
          if (selectedWordIndices.has(idx)) {
            selectedWordIndices.delete(idx);
            btn.classList.remove("selected");
          } else {
            selectedWordIndices.add(idx);
            btn.classList.add("selected");
          }
        };
        grid.appendChild(btn);
      });
    }

    function checkGerman() {
      if (!currentGermanTask) return;
      const expectedType = currentGermanTask.expectedType;

      const expectedIndices = new Set(
        currentGermanTask.words
          .map((w, i) => (w.type === expectedType ? i : -1))
          .filter((i) => i !== -1)
      );

      const exactMatch =
        selectedWordIndices.size === expectedIndices.size &&
        Array.from(expectedIndices).every((i) => selectedWordIndices.has(i));

      const fb = document.getElementById("german-feedback");
      const buttons = document.querySelectorAll("#german-words .word-btn");
      clearWordResultClasses();

      if (exactMatch) {
        updateStats(true);
        fb.className = "feedback ok";
        fb.textContent = "Richtig gemacht! (+1 Stern)";
        setTimeout(renderGerman, 1100);
      } else {
        updateStats(false);
        buttons.forEach((btn, idx) => {
          const isPicked = selectedWordIndices.has(idx);
          const isRight = expectedIndices.has(idx);
          if (isPicked && !isRight) {
            btn.classList.add("wrong-pick");
          } else if (!isPicked && isRight) {
            btn.classList.add("missed-right");
          }
        });
        fb.className = "feedback no";
        fb.textContent = "Rot = falsches Wort gewählt, Grün = fehlt noch. Versuch es nochmal!";
      }
    }

    buildRowButtons();
    updateExtraButtonsUI();
    setAnswerMode('choice');
    nextMathQuestion();
  </script>
<script>navigator.serviceWorker.register(`sw.js´);</script>
  body>
</html>
