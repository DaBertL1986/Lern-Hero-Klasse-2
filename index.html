<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lern-Held" />
  <title>Lern-Held 2. Klasse</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      position: relative;
      background-color: #f4f7fb;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.16) 1px, transparent 1px),
        linear-gradient(155deg, #e8f0fe 0%, #fdf8e7 52%, #e6f4ea 100%);
      background-size: 24px 24px, 24px 24px, 100% 100%;
      color: #1e293b;
    }
    .bg-school-art {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-scene-svg {
      position: absolute;
      opacity: 0.22;
      filter: saturate(0.85);
    }
    .bg-scene-board {
      left: clamp(8px, 2.5vw, 44px);
      bottom: clamp(12px, 3vh, 44px);
      width: clamp(170px, 24vw, 310px);
      height: auto;
    }
    .bg-scene-books {
      right: clamp(10px, 2.5vw, 48px);
      bottom: clamp(12px, 3vh, 44px);
      width: clamp(140px, 19vw, 245px);
      height: auto;
    }
    @media (max-width: 900px) {
      .bg-scene-svg {
        opacity: 0.14;
      }
      .bg-scene-board {
        width: 145px;
        left: -10px;
        bottom: 8px;
      }
      .bg-scene-books {
        width: 120px;
        right: -8px;
        bottom: 8px;
      }
    }
    .app {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      border: 1px solid #e2e8f0;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      text-align: center;
      color: #3730a3;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .pill {
      background: #f1f5f9;
      padding: 8px 14px;
      border-radius: 999px;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 12px 10px;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #4f46e5;
      color: #fff;
    }
    .mode-selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .mode-btn {
      padding: 10px 16px;
      border-radius: 14px;
      border: none;
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .mode-btn.active {
      background: #8b5cf6;
      color: #fff;
    }
    .row-selector, .german-cat-selector, .math-extra-selector, .letter-selector, .letter-quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .row-btn, .cat-btn, .extra-btn, .letter-btn, .quick-btn {
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .letter-btn {
      min-width: 42px;
      font-size: 1rem;
    }
    @media (max-width: 440px) {
      body {
        padding: 12px;
      }
      .app {
        padding: 16px 14px;
        border-radius: 20px;
      }
      .letter-selector {
        gap: 6px;
      }
      .letter-btn {
        min-width: 38px;
        padding: 7px 9px;
        font-size: 0.95rem;
      }
      .german-instruction {
        font-size: 1.15rem;
      }
    }
    .quick-btn {
      font-size: 0.88rem;
      background: #f8fafc;
    }
    .quick-btn.active {
      background: #0ea5e9;
      color: #ffffff;
      border-color: #0ea5e9;
    }
    .row-btn.active, .letter-btn.active {
      background: #0ea5e9;
      color: #ffffff;
      border-color: #0ea5e9;
    }
    .cat-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
    }
    .cat-btn.special.active,
    .extra-btn.special.active {
      background: #eab308;
      color: #ffffff;
      border-color: #eab308;
    }
    .card {
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .question-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 14px;
    }
    .question {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0;
      color: #0f172a;
    }
    .tip-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #3730a3;
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tip-btn:hover {
      background: #eef2ff;
    }
    .tip-btn.active {
      background: #3730a3;
      color: #ffffff;
      border-color: #3730a3;
    }
    .hint {
      font-size: 1rem;
      color: #475569;
      margin-bottom: 14px;
    }
    .german-header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .german-instruction {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
      line-height: 1.35;
    }
    .merke-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #3730a3;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .merke-btn:hover {
      background: #eef2ff;
    }
    .merke-btn.active {
      background: #3730a3;
      color: #ffffff;
      border-color: #3730a3;
    }
    .merke-box {
      max-width: 560px;
      margin: 0 auto 16px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #1e293b;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
    }
    .merke-box p {
      margin: 0 0 8px;
    }
    .merke-box p:last-child {
      margin-bottom: 0;
    }
    .merke-highlight {
      color: #3730a3;
      font-weight: 800;
      background: #e0e7ff;
      padding: 1px 6px;
      border-radius: 6px;
    }
    .source-status {
      display: none;
    }
    .adjust-toggle-wrap {
      max-width: 640px;
      margin: 0 auto 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .mini-btn {
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
      z-index: 2;
    }
    .mini-btn:hover {
      background: #eef2ff;
    }
    .mini-btn.active-mode {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .num-input {
      font-size: 1.8rem;
      padding: 10px 16px;
      width: 140px;
      text-align: center;
      border-radius: 14px;
      border: none;
      background: #ffffff;
      font-weight: 700;
    }
    .num-input:focus {
      outline: none;
    }
    .opt-btn, .word-btn, .primary-btn {
      padding: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 16px;
      border: none;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, opacity 0.15s;
    }
    .opt-btn, .opt-btn:hover, .opt-btn:focus, .opt-btn:active {
      background: #ffffff;
      color: #1e293b;
      border: none;
      outline: none;
    }
    .word-btn:hover:not(:disabled) {
      background: #eef2ff;
    }
    .word-btn:disabled {
      cursor: default;
      opacity: 0.92;
    }
    .opt-btn:focus, .word-btn:focus, .row-btn:focus, .cat-btn:focus, .extra-btn:focus, .mode-btn:focus, .tab-btn:focus, .primary-btn:focus, .reset-btn:focus, .letter-btn:focus, .quick-btn:focus, .mini-btn:focus, .tip-btn:focus, .merke-btn:focus {
      outline: none;
    }
    .word-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .word-btn.selected {
      background: #fef08a;
    }
    .word-btn.wrong-pick {
      background: #fee2e2;
      color: #991b1b;
    }
    .word-btn.missed-right {
      background: #dcfce7;
      color: #166534;
      box-shadow: inset 0 0 0 2px #16a34a;
    }
    .primary-btn {
      background: #16a34a;
      color: #fff;
      width: 100%;
      margin-top: 8px;
    }
    .primary-btn.check-btn {
      width: auto;
      min-width: 180px;
      max-width: 240px;
      padding: 12px 24px;
      font-size: 1.05rem;
      display: inline-block;
    }
    .primary-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .letter-pair-preview {
      display: none;
    }
    .canvas-wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 14px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #write-canvas {
      display: block;
      width: 100%;
      height: 240px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }
    @media (orientation: landscape) and (max-height: 520px) {
      body {
        padding: 10px;
      }
      .app {
        max-width: 100%;
        padding: 14px;
      }
      .canvas-wrap {
        max-width: 100%;
        margin-bottom: 10px;
      }
      #write-canvas {
        height: 185px;
      }
      .card {
        padding: 14px;
      }
    }
    .write-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 640px;
      margin: 0 auto;
    }
    .secondary-btn {
      padding: 13px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background: #f1f5f9;
    }
    .feedback {
      margin-top: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      min-height: 28px;
      line-height: 1.4;
    }
    .feedback-tip-line {
      display: block;
      margin-top: 4px;
      font-size: 1.02rem;
      font-weight: 700;
    }
    .ok { color: #15803d; }
    .no { color: #dc2626; }
    .footer-actions {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }
    .reset-btn {
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .reset-btn:hover {
      background: #fee2e2;
    }
  </style>
</head>
<body>

    <!-- Schulkind an der Schultafel -->
    <svg class="bg-scene-svg bg-scene-board" viewBox="0 0 320 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="24" width="186" height="114" rx="10" fill="#92400e" />

    </svg>

    <!-- Gestapelte Lehrbücher -->
    <svg class="bg-scene-svg bg-scene-books" viewBox="0 0 250 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="16" y1="196" x2="234" y2="196" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
      <rect x="28" y="158" width="176" height="36" rx="6" fill="#2563eb" />

      <line x1="52" y1="181" x2="96" y2="181" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />

  </div>

  <div class="app">
    <h1>Lern-Held 2. Klasse</h1>
    <div class="stats">
      <div class="pill">Sterne: <span id="stars">0</span></div>
      <div class="pill">Serie: <span id="streak">0</span></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-math" onclick="switchTab('math')">Mathe</button>
      <button class="tab-btn" id="tab-german" onclick="switchTab('german')">Wörter</button>
      <button class="tab-btn" id="tab-alphabet" onclick="switchTab('alphabet')">Alphabet</button>
    </div>

    <div id="math-section">
      <div class="mode-selector">
        <button class="mode-btn active" id="mode-choice" onclick="setAnswerMode('choice')">Touch-Eingabe</button>
        <button class="mode-btn" id="mode-input" onclick="setAnswerMode('input')">Zahlen-Eingabe</button>
      </div>

      <div class="row-selector" id="row-selector"></div>

      <div class="math-extra-selector">
        <button class="extra-btn special" id="btn-mix-pm" onclick="toggleMixPlusMinus()">Gemischt mit +/-</button>
      </div>

      <div class="card">
        <div class="hint" id="math-order-info"></div>
        <div class="question-row">
          <div class="question" id="math-question"></div>
          <button class="tip-btn" id="btn-math-tip" type="button" title="Tipp anzeigen" aria-label="Tipp anzeigen" onclick="toggleMathTip()">?</button>
        </div>
        <div class="hint" id="math-hint" style="display:none;"></div>

        <div class="options" id="math-options"></div>

        <div class="input-box" id="math-input-box" style="display:none;">
          <input type="number" id="math-user-input" class="num-input" placeholder="?" pattern="[0-9]*" inputmode="numeric" />
          <button class="primary-btn" style="max-width:220px;" onclick="checkMathInput()">Prüfen</button>
        </div>

        <div class="feedback" id="math-feedback"></div>
      </div>
    </div>

    <div id="german-section" style="display:none;">
      <div class="german-cat-selector" id="german-cat-selector">
        <button class="cat-btn active" id="cat-namen" onclick="setGermanCategory('namen')">Namenwörter</button>
        <button class="cat-btn" id="cat-tun" onclick="setGermanCategory('tun')">Tun-Wörter</button>
        <button class="cat-btn special" id="cat-mix" onclick="setGermanCategory('mix')">Gemischt</button>
      </div>

      <div class="card">
        <div class="german-header-row">
          <div class="german-instruction" id="german-instruction"></div>
          <button class="merke-btn" id="btn-word-merke" type="button" onclick="toggleWordMerke()">Merke</button>
        </div>
        <div class="merke-box" id="word-merke-box" style="display:none;"></div>
        <div class="word-grid" id="german-words"></div>
        <button class="primary-btn check-btn" id="german-check-btn" onclick="checkGerman()">Antwort prüfen</button>
        <div class="feedback" id="german-feedback"></div>
      </div>
    </div>

    <div id="alphabet-section" style="display:none;">
      <div class="letter-selector" id="letter-selector"></div>

      <div class="letter-quick-actions">
        <button class="quick-btn" id="btn-select-all-letters" type="button" onclick="selectAllLetters()">Alle</button>
        <button class="quick-btn" type="button" onclick="pickRandomLetter()">Zufälliger Buchstabe</button>
      </div>

      <div class="card">
        <div class="hint" id="alphabet-selected-info"></div>
        <div class="source-status" id="alphabet-source-status"></div>
        <div class="hint" id="alphabet-writing-tip">Schreibbereich auf den markierten Buchstaben begrenzt.</div>

        <div class="adjust-toggle-wrap">
          <button class="mini-btn" id="btn-pen-only" type="button" onclick="togglePenOnlyMode()">Nur Stift: Aus</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="write-canvas" width="640" height="240"></canvas>
        </div>

        <div class="write-actions">
          <button class="secondary-btn" type="button" onclick="prevAlphabetLetter()">Vorheriger</button>
          <button class="secondary-btn" type="button" onclick="clearWritingCanvas()">Feld löschen</button>
          <button id="next-letter-btn" class="secondary-btn" type="button" onclick="handleNextAlphabetLetter()">Nächster</button>
        </div>

        <div class="feedback" id="alphabet-feedback"></div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="reset-btn" type="button" onclick="resetStarsAndStreak()">Sterne &amp; Serie zurücksetzen</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY_ADJUSTMENTS = "lernheld_letter_adjustments_v3";

    let stars = 0;
    let streak = 0;
    let activeRows = new Set([2]);
    let mixPlusMinusEnabled = false;
    let answerMode = 'choice';
    let currentAnswer = null;
    let currentLabel = "";
    let currentMathHint = "";
    let mathTipVisible = false;

    let germanCategory = 'namen';
    let currentGermanTask = null;
    let mixStep = 0;

    function loadSavedAdjustments() {
      const merged = {};
      for (const item of alphabetItems) {
        const v = defaultLetterAdjustments[item.key] || {};
        merged[item.key] = {
          upper: { scale: Number(v.upper?.scale ?? 1.0), offsetY: Number(v.upper?.offsetY ?? 0) },
          lower: { scale: Number(v.lower?.scale ?? 1.0), offsetY: Number(v.lower?.offsetY ?? 0) }
        };
      }
      try {
        const raw = localStorage.getItem(STORAGE_KEY_ADJUSTMENTS);
        if (raw) {
          const parsed = JSON.parse(raw);
          for (const [k, v] of Object.entries(parsed)) {
            if (!merged[k]) continue;
            merged[k] = {
              upper: {
                scale: Number(v.upper?.scale ?? merged[k].upper.scale),
                offsetY: Number(v.upper?.offsetY ?? merged[k].upper.offsetY)
              },
              lower: {
                scale: Number(v.lower?.scale ?? merged[k].lower.scale),
                offsetY: Number(v.lower?.offsetY ?? merged[k].lower.offsetY)
              }
            };
          }
        }
      } catch (e) {}
      return merged;
    }

    const letterAdjustments = loadSavedAdjustments();

    function getAdjFor(key, variant) {
      if (!letterAdjustments[key]) {
        letterAdjustments[key] = {
          upper: { scale: 1.0, offsetY: 0 },
          lower: { scale: 1.0, offsetY: 0 }
        };
      }
      if (!letterAdjustments[key][variant]) {
        letterAdjustments[key][variant] = { scale: 1.0, offsetY: 0 };
      }
      return letterAdjustments[key][variant];
    }

    function getVariantCandidates(item, variant) {
      const candidates = [];
      const addIfUnique = (p) => {
        if (!candidates.includes(p)) candidates.push(p);
      };

      const exts = ["png", "PNG", "jpg", "jpeg", "JPG", "JPEG"];
      const upperBase = item.upper;
      const lowerBase = item.lower;

      if (variant === "upper") {
        const bases = [upperBase, upperBase.toLowerCase()];
        if (item.key === "ß" || item.key === "ẞ") {
          bases.push("ss", "SS");
        }
        for (const base of bases) {
          for (const ext of exts) {
            addIfUnique(`buchstaben/${base}_gross.${ext}`);
            addIfUnique(`buchstaben/${base}.${ext}`);
          }
        }
      } else {
        const bases = [lowerBase, lowerBase.toUpperCase()];
        if (item.key === "Qu") {
          bases.push("Qu");
        }
        for (const base of bases) {
          for (const ext of exts) {
            addIfUnique(`buchstaben/${base}_klein.${ext}`);
            addIfUnique(`buchstaben/${base}.${ext}`);
          }
        }
      }

      return candidates;
    }

    function loadVariantImage(cacheKey, candidates) {
      if (templateImageCache.has(cacheKey)) {
        return templateImageCache.get(cacheKey);
      }

      const state = {
        img: new Image(),
        loaded: false,
        failed: false,
        matchedSrc: "",
        triedSrc: candidates[0] || "",
        idx: 0
      };

      function tryNext() {
        if (state.idx >= candidates.length) {
          state.failed = true;
          if (document.getElementById("alphabet-section").style.display !== "none") {
            drawWritingTemplate(false);
          }
          return;
        }
        const nextSrc = candidates[state.idx++];
        state.triedSrc = nextSrc;
        state.img.src = nextSrc;
      }

      state.img.onload = () => {
        if (state.img.naturalWidth > 0 && state.img.naturalHeight > 0) {
          state.loaded = true;
          state.failed = false;
          state.matchedSrc = state.triedSrc;
          if (document.getElementById("alphabet-section").style.display !== "none") {
            drawWritingTemplate(false);
          }
        } else {
          tryNext();
        }
      };

      state.img.onerror = () => {
        tryNext();
      };

      templateImageCache.set(cacheKey, state);
      tryNext();
      return state;
    }

    function getLetterImages(key) {
      const item = getLetterItem(key);
      const upperState = loadVariantImage(`${key}:upper`, getVariantCandidates(item, "upper"));
      const lowerState = item.hasLower
        ? loadVariantImage(`${key}:lower`, getVariantCandidates(item, "lower"))
        : null;
      return { item, upperState, lowerState };
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildGermanTask(expectedType) {
      const isNamen = expectedType === "namen";
      const targetPool = shuffleArray(isNamen ? namenWoerter : tunWoerter);
      const distractorPool = shuffleArray(isNamen ? tunWoerter : namenWoerter);

      const totalCount = 6;
      const targetCount = Math.floor(Math.random() * 5) + 1;
      const distractorCount = totalCount - targetCount;

      const items = [
        ...targetPool.slice(0, targetCount).map((text) => ({
          text,
          type: expectedType
        })),
        ...distractorPool.slice(0, distractorCount).map((text) => ({
          text,
          type: isNamen ? "tun" : "namen"
        }))
      ];

      return {
        expectedType,
        title: isNamen
          ? "Welche Wörter sind NAMENWÖRTER (Nomen)?"
          : "Welche Wörter sind TUN-WÖRTER (Verben)?",
        words: shuffleArray(items)
      };
    }

              if (currentLetterKey === item.key) {
                currentLetterKey = getSortedActiveLetters()[0];

    function pickRandomLetter() {

      if (chosen.length === 0) return;
      isAdvancingLetter = false;

      currentCasePhase = "upper";

    function stepToNextLetterOnly() {
      const chosen = getSortedActiveLetters();
      if (chosen.length === 0) return;
      const idx = chosen.indexOf(currentLetterKey);
      const nextIdx = (idx + 1) % chosen.length;
      currentLetterKey = chosen[nextIdx];
      currentCasePhase = "upper";
      isAdvancingLetter = false;
      document.getElementById("alphabet-feedback").textContent = "";
      drawWritingTemplate(true);
    }

    function prevAlphabetLetter() {
      const chosen = getSortedActiveLetters();
      if (chosen.length === 0) return;
      const item = getLetterItem(currentLetterKey);
      if (item.hasLower && currentCasePhase === "lower") {
        currentCasePhase = "upper";
        isAdvancingLetter = false;
        document.getElementById("alphabet-feedback").textContent = "";
        drawWritingTemplate(true);
        return;
      }
      const idx = chosen.indexOf(currentLetterKey);
      const prevIdx = (idx - 1 + chosen.length) % chosen.length;
      const prevItem = getLetterItem(chosen[prevIdx]);
      currentLetterKey = chosen[prevIdx];
      currentCasePhase = prevItem.hasLower ? "lower" : "upper";
      isAdvancingLetter = false;
      document.getElementById("alphabet-feedback").textContent = "";
      drawWritingTemplate(true);
    }

    function handleNextAlphabetLetter() {
      if (isAdvancingLetter) return;
      const fb = document.getElementById("alphabet-feedback");
      const item = getLetterItem(currentLetterKey);
      const glyph = getActiveDisplayGlyph(item);

      if (hasDrawnStroke) {
        isAdvancingLetter = true;
        updateStats(true);
        hasDrawnStroke = false;
        fb.className = "feedback ok";
        fb.textContent = `Super! ${glyph} geübt (+1 Stern)`;
        setTimeout(() => {
          if (item.hasLower && currentCasePhase === "upper") {
            currentCasePhase = "lower";
            isAdvancingLetter = false;
            fb.textContent = "";
            drawWritingTemplate(true);
          } else {
            stepToNextLetterOnly();
          }
        }, 650);
      } else if (item.hasLower && currentCasePhase === "upper") {
        currentCasePhase = "lower";
        isAdvancingLetter = false;
        fb.textContent = "";
        drawWritingTemplate(true);
      } else {
        stepToNextLetterOnly();
      }
    }

    }

    function syncCanvasSizeWithLayout() {
      const rect = writeCanvas.getBoundingClientRect();
      const targetWidth = Math.max(320, Math.round(rect.width || 640));
      const targetHeight = Math.max(160, Math.round(rect.height || 240));

      if (writeCanvas.width !== targetWidth || writeCanvas.height !== targetHeight) {
        const tempStroke = document.createElement("canvas");
        tempStroke.width = strokeCanvas.width;
        tempStroke.height = strokeCanvas.height;
        tempStroke.getContext("2d").drawImage(strokeCanvas, 0, 0);

        writeCanvas.width = targetWidth;
        writeCanvas.height = targetHeight;
        strokeCanvas.width = targetWidth;
        strokeCanvas.height = targetHeight;

        strokeCtx.clearRect(0, 0, targetWidth, targetHeight);
        strokeCtx.drawImage(tempStroke, 0, 0, targetWidth, targetHeight);
      }
    }

    function fitImageIntoBox(img, maxW, maxH) {
      const aspect = img.naturalWidth / img.naturalHeight;
      let drawW = Math.round(maxH * aspect);
      let drawH = maxH;
      if (drawW > maxW) {
        drawW = maxW;
        drawH = Math.round(drawW / aspect);
      }
      return { drawW, drawH };
    }

    function computeAllowedBoxForGlyph(w, h, topLine, descenderLine, drawX, drawY, drawW, drawH, isLower) {
      const padX = Math.round(w * 0.14);
      const padY = isLower ? Math.round(h * 0.14) : Math.round(h * 0.10);
      const left = Math.max(12, drawX - padX);
      const right = Math.min(w - 12, drawX + drawW + padX);
      const top = Math.max(10, Math.min(topLine - 8, drawY - padY));
      const bottom = Math.min(h - 10, Math.max(descenderLine + 6, drawY + drawH + padY));
      return {
        left,
        top,
        right: Math.max(left + 60, right),
        bottom: Math.max(top + 60, bottom)
      };
    }

    function isPointInsideAllowedBox(pt) {
      if (!currentAllowedBox) return true;
      return (
        pt.x >= currentAllowedBox.left &&
        pt.x <= currentAllowedBox.right &&
        pt.y >= currentAllowedBox.top &&
        pt.y <= currentAllowedBox.bottom
      );
    }

    function drawWritingTemplate(resetStrokes = true) {
      updateAlphabetInfo();
      syncCanvasSizeWithLayout();

      if (resetStrokes) {
        strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
        hasDrawnStroke = false;
      }

      const w = writeCanvas.width;
      const h = writeCanvas.height;

      writeCtx.clearRect(0, 0, w, h);
      writeCtx.fillStyle = "#ffffff";
      writeCtx.fillRect(0, 0, w, h);

      const topLine = Math.round(h * 0.20);
      const midLine = Math.round(h * 0.47);
      const baseLine = Math.round(h * 0.72);
      const descenderLine = Math.round(h * 0.90);

      writeCtx.save();
      writeCtx.lineWidth = 1.5;

      writeCtx.strokeStyle = "#cbd5e1";
      writeCtx.setLineDash([]);
      writeCtx.beginPath();
      writeCtx.moveTo(16, topLine);
      writeCtx.lineTo(w - 16, topLine);
      writeCtx.moveTo(16, baseLine);
      writeCtx.lineTo(w - 16, baseLine);
      writeCtx.stroke();

      writeCtx.strokeStyle = "#94a3b8";
      writeCtx.setLineDash([6, 6]);
      writeCtx.beginPath();
      writeCtx.moveTo(16, midLine);
      writeCtx.lineTo(w - 16, midLine);
      writeCtx.moveTo(16, descenderLine);
      writeCtx.lineTo(w - 16, descenderLine);
      writeCtx.stroke();
      writeCtx.restore();

      const { item, upperState, lowerState } = getLetterImages(currentLetterKey);

      const useLower = Boolean(item.hasLower && currentCasePhase === "lower");
      const activeState = useLower ? lowerState : upperState;
      const activeAdj = useLower
        ? getAdjFor(currentLetterKey, "lower")
        : getAdjFor(currentLetterKey, "upper");

      const mainHeight = Math.max(24, baseLine - topLine);
      const smallToDescenderHeight = Math.max(24, descenderLine - midLine);

      const hasGlyph = Boolean(activeState && activeState.loaded && activeState.img.naturalWidth > 0);

      if (hasGlyph) {
        const targetH = useLower
          ? Math.round(smallToDescenderHeight * 1.05 * activeAdj.scale)
          : Math.round(mainHeight * 1.32 * activeAdj.scale);
        const offsetY = Math.round((activeAdj.offsetY * h) / 240);
        const { drawW, drawH } = fitImageIntoBox(activeState.img, Math.round(w * 0.42), targetH);
        const drawX = Math.round((w - drawW) / 2);
        const drawY = useLower
          ? Math.round(midLine + offsetY)
          : Math.round(baseLine - drawH + offsetY);

        currentAllowedBox = computeAllowedBoxForGlyph(
          w, h, topLine, descenderLine, drawX, drawY, drawW, drawH, useLower
        );

        writeCtx.save();
        writeCtx.strokeStyle = "#93c5fd";
        writeCtx.lineWidth = 1.5;
        writeCtx.setLineDash([5, 5]);
        writeCtx.strokeRect(
          currentAllowedBox.left,
          currentAllowedBox.top,
          currentAllowedBox.right - currentAllowedBox.left,
          currentAllowedBox.bottom - currentAllowedBox.top
        );
        writeCtx.restore();

        writeCtx.save();
        writeCtx.globalCompositeOperation = "multiply";
        writeCtx.globalAlpha = 0.78;
        writeCtx.drawImage(
          activeState.img,
          0,
          0,
          activeState.img.naturalWidth,
          activeState.img.naturalHeight,
          drawX,
          drawY,
          drawW,
          drawH
        );
        writeCtx.restore();
      } else {
        currentAllowedBox = {
          left: Math.round(w * 0.25),
          top: Math.max(12, topLine - 10),
          right: Math.round(w * 0.75),
          bottom: Math.min(h - 12, descenderLine + 8)
        };
      }

      writeCtx.drawImage(strokeCanvas, 0, 0);
    }

    function clearWritingCanvas() {
      isAdvancingLetter = false;
      activePointerId = null;
      currentStrokePoints = [];
      writeCanvas._lastPt = null;
      document.getElementById("alphabet-feedback").textContent = "";
      drawWritingTemplate(true);
    }

    function getCanvasPoint(evt) {
      const rect = writeCanvas.getBoundingClientRect();
      const scaleX = writeCanvas.width / rect.width;
      const scaleY = writeCanvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    function isAllowedPointerType(evt) {
      if (penOnlyMode) {
        return evt.pointerType === "pen";
      }
      return true;
    }

    function getStrokePathLength(pts) {
      let len = 0;
      for (let i = 1; i < pts.length; i++) {
        const dx = pts[i].x - pts[i - 1].x;
        const dy = pts[i].y - pts[i - 1].y;
        len += Math.hypot(dx, dy);
      }
      return len;
    }

    function redrawStrokeCanvasFromPoints(pts) {
      if (!pts || pts.length < 2) return;
      strokeCtx.save();
      strokeCtx.strokeStyle = "#0f172a";
      strokeCtx.lineWidth = 10;
      strokeCtx.lineCap = "round";
      strokeCtx.lineJoin = "round";
      strokeCtx.beginPath();
      strokeCtx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        strokeCtx.lineTo(pts[i].x, pts[i].y);
      }
      strokeCtx.stroke();
      strokeCtx.restore();
    }

    function drawSegment(prev, pt) {
      const dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);
      if (dist > 140) return;

      strokeCtx.save();
      strokeCtx.strokeStyle = "#0f172a";
      strokeCtx.lineWidth = 10;
      strokeCtx.lineCap = "round";
      strokeCtx.lineJoin = "round";
      strokeCtx.beginPath();
      strokeCtx.moveTo(prev.x, prev.y);
      strokeCtx.lineTo(pt.x, pt.y);
      strokeCtx.stroke();
      strokeCtx.restore();

      writeCtx.save();
      writeCtx.strokeStyle = "#0f172a";
      writeCtx.lineWidth = 10;
      writeCtx.lineCap = "round";
      writeCtx.lineJoin = "round";
      writeCtx.beginPath();
      writeCtx.moveTo(prev.x, prev.y);
      writeCtx.lineTo(pt.x, pt.y);
      writeCtx.stroke();
      writeCtx.restore();
    }

    writeCanvas.addEventListener("pointerdown", (evt) => {
      if (!isAllowedPointerType(evt)) {
        evt.preventDefault();
        return;
      }
      if (activePointerId !== null && activePointerId !== evt.pointerId) {
        evt.preventDefault();
        return;
      }

      const pt = getCanvasPoint(evt);
      if (!isPointInsideAllowedBox(pt)) {
        evt.preventDefault();
        return;
      }

      evt.preventDefault();
      activePointerId = evt.pointerId;
      try {
        writeCanvas.setPointerCapture(evt.pointerId);
      } catch (e) {}
      document.getElementById("alphabet-feedback").textContent = "";

      currentStrokePoints = [pt];
      writeCanvas._lastPt = pt;
    });

    writeCanvas.addEventListener("pointermove", (evt) => {
      if (activePointerId === null || evt.pointerId !== activePointerId) {
        if (penOnlyMode || activePointerId !== null) evt.preventDefault();
        return;
      }
      evt.preventDefault();
      const pt = getCanvasPoint(evt);
      if (!isPointInsideAllowedBox(pt)) {
        writeCanvas._lastPt = null;
        return;
      }
      const prev = writeCanvas._lastPt || pt;
      const dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);
      if (dist > 140) {
        writeCanvas._lastPt = pt;
        return;
      }
      currentStrokePoints.push(pt);
      if (getStrokePathLength(currentStrokePoints) >= 6) {
        hasDrawnStroke = true;
      }
      drawSegment(prev, pt);
      writeCanvas._lastPt = pt;
    });

    function stopDrawing(evt) {
      if (activePointerId === null) return;
      if (evt && evt.pointerId !== activePointerId) return;
      const finishedId = activePointerId;
      const finishedPts = currentStrokePoints.slice();
      activePointerId = null;
      currentStrokePoints = [];
      writeCanvas._lastPt = null;
      if (evt && writeCanvas.hasPointerCapture && writeCanvas.hasPointerCapture(finishedId)) {
        try {
          writeCanvas.releasePointerCapture(finishedId);
        } catch (e) {}
      }

      if (getStrokePathLength(finishedPts) < 6) {
        drawWritingTemplate(false);
        redrawStrokeCanvasFromPoints(finishedPts);
      }
    }

    writeCanvas.addEventListener("pointerup", stopDrawing);
    writeCanvas.addEventListener("pointercancel", stopDrawing);
    writeCanvas.addEventListener("touchstart", (e) => {
      if (penOnlyMode) e.preventDefault();
    }, { passive: false });

    window.addEventListener("resize", () => {
      if (document.getElementById("alphabet-section").style.display !== "none") {
        drawWritingTemplate(false);
      }
    });

    function formatRowMultiplication(row, multiplier) {
      return `${multiplier} · ${row}`;
    }

    function buildRepeatedAdditionTip(row, multiplier) {
      return Array(multiplier).fill(row).join(" + ");
    }

    function renderMathTipState() {
      const hintEl = document.getElementById("math-hint");
      const tipBtn = document.getElementById("btn-math-tip");
      if (hintEl) {
        hintEl.textContent = currentMathHint;
        hintEl.style.display = mathTipVisible ? "block" : "none";
      }
      if (tipBtn) {
        tipBtn.classList.toggle("active", mathTipVisible);
      }
    }

    function toggleMathTip() {
      mathTipVisible = !mathTipVisible;
      renderMathTipState();
    }

    function nextMathQuestion() {
      let hintText = "";
      const chosenRows = getSortedActiveRows();
      const row = chosenRows[Math.floor(Math.random() * chosenRows.length)];
      const rowsSummary = chosenRows.map((r) => `${r}er`).join(", ");

      if (mixPlusMinusEnabled) {
        const multiplier = Math.floor(Math.random() * 6) + 1;
        const multLabel = formatRowMultiplication(row, multiplier);
        const multProduct = row * multiplier;
        const repeatedSum = buildRepeatedAdditionTip(row, multiplier);
        const isPlus = Math.random() > 0.4;
        const addSub = Math.floor(Math.random() * 9) + 1;

        if (isPlus) {
          currentLabel = `${multLabel} + ${addSub}`;
          currentAnswer = multProduct + addSub;
          hintText = `Tipp: ${repeatedSum} = ${multProduct}, dann + ${addSub}`;
        } else {
          const safeSub = Math.min(addSub, multProduct - 1);
          const finalSub = safeSub < 1 ? 1 : safeSub;
          currentLabel = `${multLabel} - ${finalSub}`;
          currentAnswer = multProduct - finalSub;
          hintText = `Tipp: ${repeatedSum} = ${multProduct}, dann - ${finalSub}`;
        }

        document.getElementById("math-order-info").textContent =
          `Gemischt mit +/- (${rowsSummary})`;
      } else {
        const multiplier = Math.floor(Math.random() * 10) + 1;

        currentLabel = formatRowMultiplication(row, multiplier);
        currentAnswer = row * multiplier;
        hintText = `Tipp: ${buildRepeatedAdditionTip(row, multiplier)}`;

        document.getElementById("math-order-info").textContent =
          `Reihe (${rowsSummary})`;
      }

      currentMathHint = hintText;
      mathTipVisible = false;
      renderMathTipState();

      document.getElementById("math-question").textContent = `${currentLabel} = ?`;
      document.getElementById("math-feedback").textContent = "";

      const choices = new Set([currentAnswer]);
      while (choices.size < 4) {
        const offset = Math.floor(Math.random() * 9) - 4;
        const candidate = currentAnswer + offset;
        if (candidate > 0 && candidate <= 100) {
          choices.add(candidate);
        }
      }

      const shuffled = Array.from(choices).sort(() => Math.random() - 0.5);
      const optionsEl = document.getElementById("math-options");
      optionsEl.innerHTML = "";

      shuffled.forEach((val) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = val;
        btn.onclick = () => {
          btn.blur();
          evaluateAnswer(val);
        };
        optionsEl.appendChild(btn);
      });

      const inputEl = document.getElementById("math-user-input");
      inputEl.value = "";
      if (answerMode === 'input') {
        inputEl.focus();
      }
    }

    function checkMathInput() {
      const inputEl = document.getElementById("math-user-input");
      const val = parseInt(inputEl.value.trim(), 10);
      if (isNaN(val)) return;

      inputEl.value = "";
      inputEl.focus();

      evaluateAnswer(val);
    }

    document.getElementById("math-user-input").addEventListener("keyup", function(e) {
      if (e.key === "Enter") {
        checkMathInput();
      }
    });

    function evaluateAnswer(val) {
      const fb = document.getElementById("math-feedback");
      if (val === currentAnswer) {
        updateStats(true);
        fb.className = "feedback ok";
        fb.textContent = `Super! ${currentLabel} = ${currentAnswer} (+1 Stern)`;
        setTimeout(nextMathQuestion, 900);
      } else {
        updateStats(false);
        fb.className = "feedback no";
        const formattedTip = /^tipp:/i.test(currentMathHint.trim())
          ? currentMathHint.trim()
          : `Tipp: ${currentMathHint.trim()}`;
        fb.innerHTML = `Fast! Versuch es bei ${currentLabel} noch einmal.<span class="feedback-tip-line">${formattedTip}</span>`;
      }
    }

    function clearWordResultClasses() {
      const buttons = document.querySelectorAll("#german-words .word-btn");
      buttons.forEach((btn) => {
        btn.classList.remove("wrong-pick", "missed-right");
      });
    }

    function pickGermanTask() {
      if (germanCategory === "namen") {
        return buildGermanTask("namen");
      }
      if (germanCategory === "tun") {
        return buildGermanTask("tun");
      }
      const expectedType = mixStep % 2 === 0 ? "namen" : "tun";
      mixStep += 1;
      return buildGermanTask(expectedType);
    }

    function renderGerman() {
      if (germanAdvanceTimer) {
        clearTimeout(germanAdvanceTimer);
        germanAdvanceTimer = null;
      }
      germanRoundChecked = false;
      wordMerkeVisible = false;
      currentGermanTask = pickGermanTask();
      updateWordMerkeUI();
      selectedWordIndices.clear();
      document.getElementById("german-instruction").textContent = currentGermanTask.title;
      document.getElementById("german-feedback").textContent = "";

      const checkBtn = document.getElementById("german-check-btn");
      if (checkBtn) {
        checkBtn.disabled = false;
      }

      const grid = document.getElementById("german-words");
      grid.innerHTML = "";
      currentGermanTask.words.forEach((w, idx) => {
        const btn = document.createElement("button");
        btn.className = "word-btn";
        btn.textContent = w.text;
        btn.disabled = false;
        btn.onclick = () => {
          if (germanRoundChecked) return;
          clearWordResultClasses();
          document.getElementById("german-feedback").textContent = "";
          if (selectedWordIndices.has(idx)) {
            selectedWordIndices.delete(idx);
            btn.classList.remove("selected");
          } else {
            selectedWordIndices.add(idx);
            btn.classList.add("selected");
          }
        };
        grid.appendChild(btn);
      });
    }

    function checkGerman() {
      if (!currentGermanTask || germanRoundChecked) return;

      const fb = document.getElementById("german-feedback");
      if (selectedWordIndices.size === 0) {
        clearWordResultClasses();
        fb.className = "feedback no";
        fb.textContent = "Bitte wähle zuerst mindestens ein Wort aus!";
        return;
      }

      germanRoundChecked = true;
      const checkBtn = document.getElementById("german-check-btn");
      if (checkBtn) {
        checkBtn.disabled = true;
      }

      const expectedType = currentGermanTask.expectedType;

      const expectedIndices = new Set(
        currentGermanTask.words
          .map((w, i) => (w.type === expectedType ? i : -1))
          .filter((i) => i !== -1)
      );

      const missedRightWords = currentGermanTask.words
        .map((w, i) => (!selectedWordIndices.has(i) && expectedIndices.has(i) ? w.text : null))
        .filter(Boolean);

      const exactMatch =
        selectedWordIndices.size === expectedIndices.size &&
        Array.from(expectedIndices).every((i) => selectedWordIndices.has(i));

      const buttons = document.querySelectorAll("#german-words .word-btn");
      clearWordResultClasses();

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        const isPicked = selectedWordIndices.has(idx);
        const isRight = expectedIndices.has(idx);
        if (isPicked && !isRight) {
          btn.classList.add("wrong-pick");
        } else if (!isPicked && isRight) {
          btn.classList.add("missed-right");
        }
      });

      if (exactMatch) {
        updateStats(true);
        fb.className = "feedback ok";
        fb.textContent = "Richtig gemacht! (+1 Stern)";
        germanAdvanceTimer = setTimeout(renderGerman, 1500);
      } else {
        updateStats(false);
        fb.className = "feedback no";
        if (missedRightWords.length > 0) {
          fb.textContent = `Rot = falsch gewählt, Grün umrandet = nicht gewählt (${missedRightWords.join(", ")}). Gleich kommt die nächste Aufgabe!`;
        } else {
          fb.textContent = "Rot = falsch gewählt. Gleich kommt die nächste Aufgabe!";
        }
        germanAdvanceTimer = setTimeout(renderGerman, 2600);
      }
    }

    buildRowButtons();
    buildLetterButtons();
    updateExtraButtonsUI();
    setAnswerMode('choice');
    nextMathQuestion();
    preloadAllTemplateImages();
    updatePenModeUI();
    syncSelectAllButtonState();
    drawWritingTemplate(true);
  </script>
</body>
</html>
